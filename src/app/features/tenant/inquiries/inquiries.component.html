<div class="page-container">
  <h2>My Inquiries</h2>
  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading"><mat-spinner diameter="40"></mat-spinner></div>
      <table *ngIf="!loading" mat-table [dataSource]="inquiries" class="full-width">
        <ng-container matColumnDef="property">
          <th mat-header-cell *matHeaderCellDef>Property</th>
          <td mat-cell *matCellDef="let inq"><a (click)="viewProperty(inq.propertyId)" class="link">{{ inq.propertyId | slice:0:8 }}...</a></td>
        </ng-container>
        <ng-container matColumnDef="message">
          <th mat-header-cell *matHeaderCellDef>My Message</th>
          <td mat-cell *matCellDef="let inq" class="msg-cell">{{ inq.message }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let inq"><mat-chip [color]="statusColor(inq.status)" selected>{{ inq.status }}</mat-chip></td>
        </ng-container>
        <ng-container matColumnDef="response">
          <th mat-header-cell *matHeaderCellDef>Owner's Response</th>
          <td mat-cell *matCellDef="let inq" class="msg-cell">{{ inq.ownerResponseMessage || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let inq">{{ inq.createdAt | date:'mediumDate' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let inq">
            <button mat-icon-button (click)="viewProperty(inq.propertyId)" matTooltip="View Property"><mat-icon>open_in_new</mat-icon></button>
            <button mat-icon-button color="accent" *ngIf="inq.status === 'ACCEPTED'" (click)="openChat(inq)" matTooltip="Open Chat">
              <mat-icon>chat</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>
      <div *ngIf="!loading && inquiries.length === 0" class="empty-state">
        <mat-icon>inbox</mat-icon><p>No inquiries sent yet. Browse properties and send an inquiry!</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
