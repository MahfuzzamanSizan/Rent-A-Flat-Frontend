<div class="page-header" style="display:flex;justify-content:space-between;align-items:center">
  <h1>Area Management</h1>
  <button mat-raised-button color="primary" (click)="openCreate()"><mat-icon>add</mat-icon> Add Area</button>
</div>
<mat-card>
  <mat-card-content>
    <div *ngIf="loading" class="loading"><mat-spinner diameter="40"></mat-spinner></div>
    <mat-table [dataSource]="areas" *ngIf="!loading">
      <ng-container matColumnDef="city"><mat-header-cell *matHeaderCellDef>City</mat-header-cell><mat-cell *matCellDef="let a">{{ a.city }}</mat-cell></ng-container>
      <ng-container matColumnDef="district"><mat-header-cell *matHeaderCellDef>District</mat-header-cell><mat-cell *matCellDef="let a">{{ a.district }}</mat-cell></ng-container>
      <ng-container matColumnDef="areaName"><mat-header-cell *matHeaderCellDef>Area</mat-header-cell><mat-cell *matCellDef="let a">{{ a.areaName }}</mat-cell></ng-container>
      <ng-container matColumnDef="subArea"><mat-header-cell *matHeaderCellDef>Sub-Area</mat-header-cell><mat-cell *matCellDef="let a">{{ a.subArea || '—' }}</mat-cell></ng-container>
      <ng-container matColumnDef="active"><mat-header-cell *matHeaderCellDef>Active</mat-header-cell><mat-cell *matCellDef="let a"><mat-slide-toggle [checked]="a.active" (change)="toggle(a)"></mat-slide-toggle></mat-cell></ng-container>
      <ng-container matColumnDef="actions"><mat-header-cell *matHeaderCellDef>Actions</mat-header-cell><mat-cell *matCellDef="let a"><button mat-icon-button (click)="openEdit(a)"><mat-icon>edit</mat-icon></button></mat-cell></ng-container>
      <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: columns;"></mat-row>
    </mat-table>
  </mat-card-content>
</mat-card>

<div class="dialog-overlay" *ngIf="showForm" (click)="showForm = false">
  <mat-card class="dialog-card" (click)="$event.stopPropagation()">
    <mat-card-header><mat-card-title>{{ editingArea ? 'Edit' : 'Add' }} Area</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">
        <mat-form-field appearance="outline" style="width:100%"><mat-label>City</mat-label><input matInput formControlName="city" /></mat-form-field>
        <mat-form-field appearance="outline" style="width:100%"><mat-label>District</mat-label><input matInput formControlName="district" /></mat-form-field>
        <mat-form-field appearance="outline" style="width:100%"><mat-label>Area Name</mat-label><input matInput formControlName="areaName" /></mat-form-field>
        <mat-form-field appearance="outline" style="width:100%"><mat-label>Sub-Area (optional)</mat-label><input matInput formControlName="subArea" /></mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="showForm = false">Cancel</button>
      <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">Save</button>
    </mat-card-actions>
  </mat-card>
</div>
