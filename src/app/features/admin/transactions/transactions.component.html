<div class="page-header"><h1>Transactions</h1></div>
<mat-card>
  <mat-card-content>
    <div *ngIf="loading" class="loading"><mat-spinner diameter="40"></mat-spinner></div>
    <mat-table [dataSource]="transactions" *ngIf="!loading">
      <ng-container matColumnDef="type"><mat-header-cell *matHeaderCellDef>Type</mat-header-cell><mat-cell *matCellDef="let t"><mat-chip>{{ t.type }}</mat-chip></mat-cell></ng-container>
      <ng-container matColumnDef="amount"><mat-header-cell *matHeaderCellDef>Amount (৳)</mat-header-cell><mat-cell *matCellDef="let t">{{ t.amount | number }}</mat-cell></ng-container>
      <ng-container matColumnDef="gateway"><mat-header-cell *matHeaderCellDef>Gateway</mat-header-cell><mat-cell *matCellDef="let t">{{ t.gateway || '—' }}</mat-cell></ng-container>
      <ng-container matColumnDef="status"><mat-header-cell *matHeaderCellDef>Status</mat-header-cell><mat-cell *matCellDef="let t"><mat-chip>{{ t.status }}</mat-chip></mat-cell></ng-container>
      <ng-container matColumnDef="createdAt"><mat-header-cell *matHeaderCellDef>Date</mat-header-cell><mat-cell *matCellDef="let t">{{ t.createdAt | date:'medium' }}</mat-cell></ng-container>
      <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: columns;"></mat-row>
    </mat-table>
    <mat-paginator [length]="totalElements" [pageSize]="size" (page)="onPage($event)"></mat-paginator>
  </mat-card-content>
</mat-card>
