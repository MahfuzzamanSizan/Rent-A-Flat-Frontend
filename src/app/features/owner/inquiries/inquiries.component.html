<div class="page-container">
  <div class="page-header">
    <h2>Inquiries</h2>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading"><mat-spinner diameter="40"></mat-spinner></div>

      <table *ngIf="!loading" mat-table [dataSource]="inquiries" class="full-width">
        <ng-container matColumnDef="tenant">
          <th mat-header-cell *matHeaderCellDef>Tenant ID</th>
          <td mat-cell *matCellDef="let inq">{{ inq.tenantId | slice:0:8 }}...</td>
        </ng-container>

        <ng-container matColumnDef="message">
          <th mat-header-cell *matHeaderCellDef>Message</th>
          <td mat-cell *matCellDef="let inq" class="message-cell">{{ inq.message }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let inq">
            <mat-chip [color]="statusColor(inq.status)" selected>{{ inq.status }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let inq">{{ inq.createdAt | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let inq">
            <button mat-icon-button color="primary" *ngIf="inq.status === 'PENDING'" (click)="openRespond(inq)" matTooltip="Respond">
              <mat-icon>reply</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>

      <div *ngIf="!loading && inquiries.length === 0" class="empty-state">
        <mat-icon>inbox</mat-icon>
        <p>No inquiries yet</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<!-- Respond Dialog -->
<div *ngIf="respondingTo" class="overlay">
  <mat-card class="dialog-card">
    <mat-card-header>
      <mat-card-title>Respond to Inquiry</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="inquiry-msg">{{ respondingTo.message }}</p>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Your Response (optional)</mat-label>
        <textarea matInput [(ngModel)]="responseMessage" rows="3"></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="respondingTo = null">Cancel</button>
      <button mat-stroked-button color="warn" (click)="reject()">Reject</button>
      <button mat-raised-button color="primary" (click)="accept()">Accept</button>
    </mat-card-actions>
  </mat-card>
</div>
